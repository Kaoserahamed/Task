# MongoDB data volume
volumes:
  mongo_data:
  backend_uploads:

services:
  # MongoDB — backing service for the backend API
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend API (Express + Socket.IO)
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      # Local in-compose MongoDB connection
      - MONGODB_URI=mongodb://mongo:27017/tourmate
      # JWT (set real values in backend/.env for anything non-local)
      - JWT_SECRET=${JWT_SECRET:-dev_only_jwt_secret_change_me}
      - JWT_EXPIRES_IN=7d
      # CORS
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_URL=http://localhost:3001
      - COMPANY_URL=http://localhost:3002
    volumes:
      - backend_uploads:/app/uploads
    # Optional: load additional secrets (Cloudinary, Pusher, email, demo
    # passwords) from backend/.env without baking them into the image.
    # env_file:
    #   - ./backend/.env

  # Customer storefront (React build served by nginx)
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'
    # CRA inlines REACT_APP_* at build time, so this is a build argument:
    # the browser talks to the API directly, not through this container.
    args:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:4000}

  # Admin console (React build served by nginx)
  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3001:80'
    args:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:4000}

  # Tour company dashboard (React build served by nginx)
  company:
    build: ./tourcompanydashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3002:80'
    args:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:4000}
