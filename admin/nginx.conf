# nginx for the admin dashboard: static CRA output + SPA history fallback.
#
# The bundle talks to the API at the absolute URL baked in at build time
# (REACT_APP_API_URL), so no API proxy is needed here: requests leave the
# browser, not this container. Socket.IO is reached the same way, on
# http://localhost:4000.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # CRA fingerprints everything under /static, so those assets are immutable.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: a hard refresh on /admin/companies or
    # /admin/registration-request/3 must serve index.html and let the router
    # resolve the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document must never be cached, or a deploy leaves stale
    # references to hashed assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}