version: 2
updates:
  # Root tooling (Prettier, ESLint flat-config deps, release scripts)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    target-branch: main
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - root-tooling
    groups:
      root-tooling:
        patterns:
          - '*'

  # Backend dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    target-branch: main
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - backend

  # Frontend dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    target-branch: main
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - frontend

  # Admin dashboard dependencies
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    target-branch: main
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - admin

  # Tour-company dashboard dependencies
  - package-ecosystem: npm
    directory: /tourcompanydashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    target-branch: main
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - company-dashboard

  # GitHub Actions and Docker base images
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    target-branch: main

  # The API base image (node:20-alpine in backend/Dockerfile)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    target-branch: main
