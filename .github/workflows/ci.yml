name: Continuous Integration

# One definition of "green" for a laptop and for CI: `npm run verify` at the
# repository root runs the same lint/format/type/test gates this workflow
# enforces. See CONTRIBUTING.md and docs/ci-cd.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: '20'
  JWT_SECRET: ci-test-secret

jobs:
  terraform-security:
    name: Terraform policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform for high-severity misconfigurations
        uses: aquasecurity/tfsec-action@v0.3.1
        with:
          soft_fail: false
          args: '--no-color --severity HIGH,CRITICAL infrastructure/terraform'

  dependency-health:
    name: Dependency health and ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Check every manifest and lockfile
        run: npm run dependency:check
      - name: Audit all production dependency graphs
        run: npm run dependency:audit

  # ---------------------------------------------------------------------------
  # Express + MongoDB API: lint, formatting, types, audit, hermetic unit tests
  # ---------------------------------------------------------------------------
  backend:
    name: Backend - quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Audit production dependencies (fails on high severity)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests with global and per-area coverage gates
        run: npm run test:coverage
      - name: Verify backend coverage summary
        run: npm run coverage:check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Integration suite: the same API against a real MongoDB
  # ---------------------------------------------------------------------------
  integration:
    name: Backend - integration tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/task-integration
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Integration tests
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # React apps: lint, tests, production build
  # ---------------------------------------------------------------------------
  web:
    name: ${{ matrix.app }} - quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin, tourcompanydashboard]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Audit production dependencies (fails on high severity)
        run: npm audit --omit=dev --audit-level=high
      - name: Tests with global and API coverage thresholds
        run: npm run test:coverage
      - name: Verify ${{ matrix.app }} coverage summary
        run: npm run coverage:check
      - name: Production build
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:4000
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-coverage
          path: ${{ matrix.app }}/coverage/
          if-no-files-found: warn
      - name: Upload production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: ${{ matrix.app }}/build/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # A clone with nothing but the repository must install and verify itself
  # ---------------------------------------------------------------------------
  fresh-clone:
    name: Fresh clone - setup and repository guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install every package as documented
        run: npm run setup
      - name: Repository guard
        run: npm run verify:repo
      - name: Formatting is clean on a fresh clone
        run: npm run format:check
      - name: Full fresh-clone verification
        run: npm run verify

  # ---------------------------------------------------------------------------
  # The containers the README promises must build and configure cleanly
  # ---------------------------------------------------------------------------
  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, integration, web, fresh-clone]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose files
        run: docker compose config --quiet
      - name: Build the API image
        run: docker compose build backend
      - name: Build the storefront image
        run: docker compose build frontend
      - name: Build the admin console image
        run: docker compose build admin
      - name: Build the company dashboard image
        run: docker compose build company
