name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        env:
          JWT_SECRET: test-secret
        run: npm test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        env:
          CI: 'true'
          REACT_APP_DEMO_USER_PASSWORD: demo-user-password
        run: npm test -- --watchAll=false

  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: http://localhost:4000
        run: npm run build

  test-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install admin dependencies
        working-directory: ./admin
        run: npm ci

      - name: Run admin tests
        working-directory: ./admin
        env:
          CI: 'true'
          REACT_APP_DEMO_ADMIN_PASSWORD: demo-admin-password
        run: npm test -- --watchAll=false

  build-admin:
    runs-on: ubuntu-latest
    needs: test-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install admin dependencies
        working-directory: ./admin
        run: npm ci

      - name: Build admin
        working-directory: ./admin
        env:
          REACT_APP_API_URL: http://localhost:4000
        run: npm run build

  test-company:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install company dashboard dependencies
        working-directory: ./tourcompanydashboard
        run: npm ci

      - name: Run company dashboard tests
        working-directory: ./tourcompanydashboard
        env:
          CI: 'true'
          REACT_APP_DEMO_COMPANY_PASSWORD: demo-company-password
        run: npm test -- --watchAll=false

  build-company:
    runs-on: ubuntu-latest
    needs: test-company

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install company dashboard dependencies
        working-directory: ./tourcompanydashboard
        run: npm ci

      - name: Build company dashboard
        working-directory: ./tourcompanydashboard
        env:
          REACT_APP_API_URL: http://localhost:4000
        run: npm run build


