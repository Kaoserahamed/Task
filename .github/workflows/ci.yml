name: Continuous Integration

# CI gates the monorepo on:
#   - lint (errors fail) everywhere
#   - unit tests + coverage artifact (backend)
#   - production build (React apps)
#
# The `verify` script in the root package.json mirrors these jobs locally:
#   npm run verify   (lint + format:check + test across all packages)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint
  # ---------------------------------------------------------------------------
  lint-backend:
    name: Lint - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Lint backend
        run: npm run lint --prefix backend

  # ---------------------------------------------------------------------------
  # Backend: tests + coverage
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Test - backend
    runs-on: ubuntu-latest
    env:
      CI: true
      JWT_SECRET: test-secret
      # mongodb-memory-server downloads its own mongod binary on Linux.
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Run tests with coverage
        run: npm run test:coverage --prefix backend
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Web apps (frontend, admin, tourcompanydashboard): lint + test + build
  # ---------------------------------------------------------------------------
  web:
    name: ${{ matrix.app }} - lint/test/build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - admin
          - tourcompanydashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.app }}
      - name: Lint
        run: npm run lint --prefix ${{ matrix.app }}
      - name: Test
        run: npm run test:ci --prefix ${{ matrix.app }}
      - name: Build
        run: npm run build --prefix ${{ matrix.app }}
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:4000

  # ---------------------------------------------------------------------------
  # Backend: TypeScript typecheck
  # ---------------------------------------------------------------------------
  typecheck-backend:
    name: Typecheck - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: TypeScript typecheck
        run: npm run typecheck --prefix backend
